<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1B26" />
      <stop offset="100%" stop-color="#16161E" />
    </linearGradient>
    <linearGradient id="php" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#777BB4" />
      <stop offset="100%" stop-color="#4F5B93" />
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.04" />
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bg)" />
  <rect width="1280" height="640" fill="url(#grid)" />

  <!-- Code Snippet Background (faint) -->
  <g transform="translate(80, 480)" fill="#FFFFFF" fill-opacity="0.05" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24">
    <text x="0" y="0">Currency::from('USD')</text>
    <text x="40" y="36">-&gt;to(['EUR', 'GBP', 'JPY'])</text>
    <text x="40" y="72">-&gt;amount(150.00)</text>
    <text x="40" y="108">-&gt;get();</text>
  </g>

  <!-- Left Content Box -->
  <g transform="translate(100, 160)">
    
    <!-- PHP Logo (Ellipse) -->
    <ellipse cx="75" cy="30" rx="75" ry="40" fill="url(#php)" />
    <text x="75" y="42" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">PHP</text>

    <!-- Main Title -->
    <text x="0" y="140" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="88" fill="#FFFFFF" letter-spacing="-2">Currency API</text>
    
    <!-- Subtitle -->
    <text x="0" y="210" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="32" fill="#A9B1D6">A unified, fluent abstraction for</text>
    <text x="0" y="260" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="32" fill="#A9B1D6">third-party currency-rate REST APIs.</text>

    <!-- Badges / Providers -->
    <g transform="translate(0, 330)">
      <!-- Row 1 -->
      <rect x="0" y="0" width="120" height="48" rx="24" fill="#24283B" stroke="#414868" stroke-width="2"/>
      <text x="60" y="30" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="16" fill="#C0CAF5" text-anchor="middle">Fixer.io</text>

      <rect x="136" y="0" width="160" height="48" rx="24" fill="#24283B" stroke="#414868" stroke-width="2"/>
      <text x="216" y="30" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="16" fill="#C0CAF5" text-anchor="middle">CurrencyLayer</text>

      <rect x="312" y="0" width="210" height="48" rx="24" fill="#24283B" stroke="#414868" stroke-width="2"/>
      <text x="417" y="30" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="16" fill="#C0CAF5" text-anchor="middle">OpenExchangeRates</text>

      <rect x="538" y="0" width="130" height="48" rx="24" fill="#24283B" stroke="#414868" stroke-width="2"/>
      <text x="603" y="30" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="16" fill="#C0CAF5" text-anchor="middle">FastForex</text>

      <!-- Row 2 -->
      <rect x="0" y="64" width="190" height="48" rx="24" fill="#24283B" stroke="#414868" stroke-width="2"/>
      <text x="95" y="94" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="16" fill="#C0CAF5" text-anchor="middle">ExchangeRatesApi</text>

      <rect x="206" y="64" width="140" height="48" rx="24" fill="#24283B" stroke="#414868" stroke-width="2"/>
      <text x="276" y="94" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="16" fill="#C0CAF5" text-anchor="middle">Frankfurter</text>

      <rect x="362" y="64" width="140" height="48" rx="24" fill="#24283B" stroke="#414868" stroke-width="2"/>
      <text x="432" y="94" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="16" fill="#C0CAF5" text-anchor="middle">CurrencyApi</text>
    </g>
  </g>
  
  <!-- Right Graphic: Center at x=980, y=320 -->
  <g transform="translate(980, 320)">
    <!-- Orbits -->
    <circle cx="0" cy="0" r="220" fill="none" stroke="#414868" stroke-width="2" stroke-dasharray="8 8" />
    <circle cx="0" cy="0" r="140" fill="none" stroke="#777BB4" stroke-width="4" stroke-opacity="0.4" />
    <circle cx="0" cy="0" r="180" fill="none" stroke="#414868" stroke-width="1" />
    
    <!-- Center Node -->
    <circle cx="0" cy="0" r="60" fill="#24283B" stroke="url(#php)" stroke-width="4" filter="url(#glow)"/>
    <text x="0" y="24" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" font-size="64" fill="#FFFFFF" text-anchor="middle">$</text>

    <!-- Outer Nodes -->
    <g transform="translate(-155, -155)">
      <circle cx="0" cy="0" r="36" fill="#16161E" stroke="#414868" stroke-width="3"/>
      <text x="0" y="14" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" font-size="36" fill="#7AA2F7" text-anchor="middle">€</text>
    </g>

    <g transform="translate(155, -155)">
      <circle cx="0" cy="0" r="36" fill="#16161E" stroke="#414868" stroke-width="3"/>
      <text x="0" y="14" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" font-size="36" fill="#BB9AF7" text-anchor="middle">£</text>
    </g>

    <g transform="translate(-155, 155)">
      <circle cx="0" cy="0" r="36" fill="#16161E" stroke="#414868" stroke-width="3"/>
      <text x="0" y="14" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" font-size="36" fill="#9ECE6A" text-anchor="middle">¥</text>
    </g>

    <g transform="translate(155, 155)">
      <circle cx="0" cy="0" r="36" fill="#16161E" stroke="#414868" stroke-width="3"/>
      <text x="0" y="14" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" font-size="36" fill="#E0AF68" text-anchor="middle">Fr</text>
    </g>
  </g>
</svg>
