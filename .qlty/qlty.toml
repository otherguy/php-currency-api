# Try Qlty Cloud: https://qlty.sh
#
# For a guide to configuration, visit https://qlty.sh/d/config
# Or for a full reference, visit https://qlty.sh/d/qlty-toml
config_version = "0"

exclude_patterns = [
  "rector.php",
  "*_min.*",
  "*-min.*",
  "*.min.*",
  "**/.yarn/**",
  "**/*.d.ts",
  "**/assets/**",
  "**/bower_components/**",
  "**/build/**",
  "**/cache/**",
  "**/config/**",
  "**/db/**",
  "**/deps/**",
  "**/dist/**",
  "**/extern/**",
  "**/external/**",
  "**/generated/**",
  "**/Godeps/**",
  "**/gradlew/**",
  "**/mvnw/**",
  "**/node_modules/**",
  "**/protos/**",
  "**/seed/**",
  "**/target/**",
  "**/templates/**",
  "**/testdata/**",
  "**/vendor/**",
]

test_patterns = [
  "**/test/**",
  "**/spec/**",
  "**/*.test.*",
  "**/*.spec.*",
  "**/*_test.*",
  "**/*_spec.*",
  "**/test_*.*",
  "**/spec_*.*",
]

[smells]
mode = "comment"

[[triage]]
match.rules = ["radarlint-php:php:S1192"]
match.file_patterns = ["tests/**"]
set.ignored = true

[[source]]
name = "default"
default = true


[[plugin]]
name = "actionlint"

[[plugin]]
name = "editorconfig-checker"
mode = "comment"

[[plugin]]
name = "osv-scanner"

[[plugin]]
name = "php-codesniffer"
mode = "comment"

[[plugin]]
name = "phpstan"
mode = "comment"

# prepare_script: install composer deps so phpstan can resolve PSR-18,
#   PHPUnit attributes, and project classes during sandboxed analysis.
# autoload_script: use the project's autoloader (with require-dev installed)
#   instead of qlty's bare phpstan tool autoloader.
# copy_configs_into_tool_install = false: keep phpstan.neon at the project
#   root so its relative `path:` rules under ignoreErrors continue to match.
[plugins.definitions.phpstan.drivers.lint]
prepare_script = "composer install --no-scripts --ignore-platform-reqs --no-interaction --no-progress"
autoload_script = "--autoload-file=vendor/autoload.php"
copy_configs_into_tool_install = false

[[plugin]]
name = "radarlint-php"
mode = "comment"

[[plugin]]
name = "ripgrep"
mode = "comment"

[[plugin]]
name = "trufflehog"
